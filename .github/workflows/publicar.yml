name: Publicar fila no Instagram
on:
  schedule:
    - cron: '7,37 * * * *' # fora da hora cheia, quando o GitHub atrasa mais
  workflow_dispatch:
concurrency: publicar # nunca duas execuções ao mesmo tempo, para não repetir post
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o que venceu
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/midia
        run: node publicar.mjs
      - name: Gravar o estado da fila
        if: always()
        run: |
          git config user.name "fila-intelles"
          git config user.email "actions@users.noreply.github.com"
          git add fila.json
          git diff --cached --quiet || (git commit -m "fila: atualiza estado" && git pull --rebase && git push)
