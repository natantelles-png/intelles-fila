name: Verificar token do Instagram
on:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Perguntar à Meta de quem é o token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          for host in graph.instagram.com graph.facebook.com; do
            resp=$(curl -s -G "https://$host/v24.0/$IG_USER_ID" --data-urlencode "fields=username,account_type" --data-urlencode "access_token=$IG_TOKEN")
            echo "RESULTADO $host: $(echo "$resp" | jq -r 'if .error then "ERRO: " + .error.message else "conta=" + (.username // "?") end')"
            limite=$(curl -s -G "https://$host/v24.0/$IG_USER_ID/content_publishing_limit" --data-urlencode "fields=quota_usage,config" --data-urlencode "access_token=$IG_TOKEN")
            echo "RESULTADO $host limite: $(echo "$limite" | jq -c 'if .error then "ERRO: " + .error.message else .data[0] end')"
          done